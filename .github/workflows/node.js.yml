name: Test
concurrency: production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps

      - name: Install nodemon
        run: npm install -g nodemon

      - name: Start backend
        run: |
          nohup npm run dev &
          sleep 5
        env:
          NODE_ENV: test

      - name: Wait for backend
        run: |
          for i in {1..10}; do
            curl --fail http://localhost:3030 && break || sleep 1
          done

      - name: Run Jest tests
        run: npm run test:unit

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Ensure badges branch exists and is up-to-date
        run: |
          git fetch origin badges || echo "No remote badges branch found"
          if git rev-parse --verify origin/badges; then
            git checkout badges || git checkout -b badges origin/badges
          else
            git checkout --orphan badges
            git reset --hard
            git commit --allow-empty -m "Initialize badges branch"
            git push origin badges
          fi

      - name: Pull latest changes from badges branch
        run: |
          git pull origin badges --rebase || echo "Nothing to pull"

      - name: ⚙️ Generating coverage badges
        uses: jpb06/coverage-badges-action@latest
        with:
          branches: main
          target-branch: badges

      - name: Push badges branch
        run: |
          git push origin badges --force
